[project]
name = "jevson"
version = "0.0.0"
description = "Schema compiler for source-grounded structured extraction (pre-implementation; Phase 0 probe harness only)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pydantic>=2.12",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/phase0/tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["tests/phase0"]
omit = ["tests/phase0/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
