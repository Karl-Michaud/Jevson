[project]
name = "jevson"  # pending the owner's name decision before publication (PLAN §6)
version = "0.1.0.dev0"
description = "Compile a Pydantic model or JSON Schema into bounded decisions and criteria-gated generative fields"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Project Asterion" }]
keywords = ["structured-output", "json-schema", "pydantic", "llm", "decisions", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# PLAN Phase 8's list, amended: rfc8785 builds the replay keys (PLAN §6 "Replay"). No extras: no LLM
# adapter and no extractor ship in v0. `format` keywords that need jsonschema's format extras
# (`jsonschema[format]`, e.g. date-time, uri) stay unchecked unless the caller installs them [L10].
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "pydantic>=2.12",
    "rfc8785>=0.1.4",
]

[project.urls]
Repository = "https://github.com/Project-Asterion/Jevson"
Changelog = "https://github.com/Project-Asterion/Jevson/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    # hatchling: tests/architecture/test_distribution.py builds the wheel and sdist offline.
    "hatchling>=1.27",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "import-linter>=2.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevson"]

[tool.hatch.build.targets.sdist]
# An allow-list, so tests/, the Phase 0 harness, fixtures, recordings and .env never ship.
only-include = ["jevson", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/phase0/tests", "tests/j4b/tests", "tests/unit", "tests/property", "tests/architecture", "tests/adversarial"]
markers = ["integration: makes real, billed API calls; opt-in, never in CI (PLAN §4.4)"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["jevson"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Protocol method bodies are declarations, never executed.
    '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = [
    "PLR2004", # magic values: the PLAN examples are literal numbers in tests
    "PLR0913", # assemble() takes the Result's pass-through fields as keywords
]

[tool.pyright]
include = ["jevson", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "jevson"
include_external_packages = true

[[tool.importlinter.contracts]]
# PLAN §2 module discipline; jevson.execute is forbidden before it exists, so the rule holds from
# its first file. tests/architecture checks the same rule by path.
name = "compile, graph and assemble never import execute or backends"
type = "forbidden"
source_modules = ["jevson.compile", "jevson.graph", "jevson.assemble"]
forbidden_modules = ["jevson.execute", "jevson.backends"]

[[tool.importlinter.contracts]]
# Only backends/decisions.py may reach the network, and only through raw httpx (PLAN §2, DESIGN §8).
name = "No vendor SDK anywhere; httpx only in backends/decisions.py"
type = "forbidden"
source_modules = ["jevson"]
forbidden_modules = ["httpx", "openai", "typesafe_sdk", "requests"]
ignore_imports = ["jevson.backends.decisions -> httpx"]
